name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telemedicine
          POSTGRES_PASSWORD: telemedicine
          POSTGRES_DB: telemedicine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U telemedicine -d telemedicine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://telemedicine:telemedicine@localhost:5432/telemedicine?schema=public
      SESSION_SECRET: ci-session-secret-not-for-production
      ADMIN_API_KEY: ci-admin-key
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @telemedicine/shared build
      - run: pnpm --filter @telemedicine/api prisma:generate
      - run: pnpm --filter @telemedicine/api exec prisma migrate deploy
      - run: pnpm --filter @telemedicine/api test
      - run: pnpm --filter @telemedicine/api build
      - run: pnpm --filter @telemedicine/web build
