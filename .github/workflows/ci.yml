name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telemedicine
          POSTGRES_PASSWORD: telemedicine
          POSTGRES_DB: telemedicine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U telemedicine -d telemedicine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://telemedicine:telemedicine@localhost:5432/telemedicine?schema=public
      SESSION_SECRET: ci-session-secret-not-for-production
      ADMIN_API_KEY: ci-admin-key
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager": "pnpm@9.15.0"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @telemedicine/shared build
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate
      - name: Run database migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
      - name: Unit tests
        run: pnpm --filter @telemedicine/api test
      - name: Build API
        run: pnpm --filter @telemedicine/api build
      - name: Build web
        run: pnpm --filter @telemedicine/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_APP_NAME: TELEMEDICINE AI
          NEXT_PUBLIC_EMERGENCY_NUMBER: 112
